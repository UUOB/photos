[package]
name = "photos-core"
# Photos' version: Android (build.gradle.kts), the Mac (mac/build.sh) and updates read it here.
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Photos without its screens: the gallery, the trash and adding photos, on the UUOB SDK."

[lib]
name = "photos_core"
# Android and the Mac load it as a shared library; Linux links it.
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes the Kotlin and Swift bindings (UniFFI) from the built library.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uuob-client = { path = "../sdk/client" }
uniffi = "0.32"
serde_json = "1"
jiff = "0.2"
base64 = "0.22"
