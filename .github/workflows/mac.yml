# Builds Photos for macOS (SwiftUI over the Rust core), Apple silicon. Run it from the Actions tab or with `gh workflow run mac.yml`.
# It leaves a .dmg (first install) and a .app.tar.gz (what the app's own
# Update button installs).
name: macOS app
on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Also take screenshots (made-up demo data), into out/shots"
        type: boolean
        default: false
      before:
        description: "With shots: the same screenshots of this released version too (e.g. 0.5.0), into out/before"
        required: false
        default: ""
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: mac/build.sh
      - name: Screenshots
        if: inputs.shots
        continue-on-error: true
        env: { BEFORE: "${{ inputs.before }}", CARGO_TARGET_DIR: "${{ runner.temp }}/uuob-target" }
        run: |
          # UUOB (its own repository, in uuob/) with made-up demo data, for the app to connect to.
          (cd uuob && cargo build -q --release -p uuob-cli && cargo build -q --release -p uuob-core --example seed)
          bin="$CARGO_TARGET_DIR/release"
          # Demo pictures: a few of macOS's own desktop pictures, and their small previews.
          pics="$RUNNER_TEMP/pics"; mkdir -p "$pics"; i=0
          for f in "/System/Library/Desktop Pictures/"*.heic; do
            [ -f "$f" ] && [ $i -lt 6 ] || continue; i=$((i+1)); n=$(printf '%s/IMG_%04d' "$pics" $((4000+i)))
            sips -s format jpeg -Z 1600 "$f" --out "$n.jpg" >/dev/null && sips -s format jpeg -Z 320 "$f" --out "$n.thumb.jpg" >/dev/null
          done
          export UUOB_SEED_PHOTOS="$pics"
          "$bin/examples/seed" "$RUNNER_TEMP/uuob" >/dev/null
          cp -R "$RUNNER_TEMP/uuob" "$RUNNER_TEMP/uuob-before"
          mac/shots.sh mac/build/Photos.app "$bin/uuob" "$RUNNER_TEMP/uuob" out/shots
          if [ -n "$BEFORE" ]; then
            osascript -e 'tell app "System Events" to tell appearance preferences to set dark mode to false'
            mkdir -p "$RUNNER_TEMP/old"
            curl -fsSL "https://github.com/jachymri/uuob-releases/releases/download/photos-v$BEFORE/Photos-$BEFORE-mac.app.tar.gz" | tar -xz -C "$RUNNER_TEMP/old"
            mac/shots.sh "$RUNNER_TEMP/old/Photos.app" "$bin/uuob" "$RUNNER_TEMP/uuob-before" out/before
          fi
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: out/*, if-no-files-found: error }
